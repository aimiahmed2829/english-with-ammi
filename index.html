<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="English With Ammi: a friendly 21-day English speaking course with Urdu translations, listening, practice and confidence-building missions.">
  <title>English With Ammi · 21-Day Speaking Course</title>
  <style>
    :root{font-size:calc(16px * var(--font-scale));--ink:#203933;--muted:#667b72;--paper:#f7f8f4;--white:#fff;--forest:#1d6556;--forest2:#e6f4ee;--coral:#e79461;--peach:#fff0e5;--border:#e0e9df;--shadow:0 10px 30px rgba(29,64,48,.07);--font-scale:1}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:1rem;line-height:1.55}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b96939;outline-offset:3px}
    button:disabled{cursor:not-allowed;opacity:.55}
    .shell{max-width:1270px;margin:auto;padding:0 22px 60px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 0 16px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:12px;font-weight:850;font-size:1.08rem;letter-spacing:-.025em}
    .logo-mark{width:45px;height:45px;border-radius:16px;background:var(--forest);color:white;display:grid;place-items:center;font-size:25px;box-shadow:0 5px 15px #1d655638}
    .meta{font-size:.79rem;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;font-weight:800}
    .control-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .font-control{background:#fff;border:1px solid var(--border);border-radius:100px;display:flex;align-items:center;padding:3px}
    .font-control button{border:0;background:transparent;color:var(--ink);padding:7px 11px;border-radius:40px;font-weight:800}
    .font-control button:hover{background:var(--forest2)}
    .top-chip{border:1px solid #d5e7dc;background:#eaf5ed;padding:8px 15px;border-radius:999px;font-size:.84rem;color:var(--forest);font-weight:800}
    .hero{display:grid;grid-template-columns:1.65fr 1fr;gap:26px;align-items:stretch;background:linear-gradient(125deg,#f4e9d6,#f2eadb 46%,#e1f0e5);border-radius:28px;padding:35px 38px;margin:8px 0 22px;overflow:hidden;position:relative}
    .hero:after{content:'✿';position:absolute;font-size:205px;line-height:1;right:-15px;top:-88px;color:#d4ddba65;pointer-events:none}
    .eyebrow{font-size:.78rem;text-transform:uppercase;font-weight:900;letter-spacing:.16em;color:#936a45;margin:0 0 9px}
    h1{font-size:clamp(2rem,4vw,3.25rem);letter-spacing:-.045em;line-height:1.12;margin:0 0 11px}
    h2,h3,p{margin-top:0}
    .hero p{color:#506d5f;max-width:570px;font-size:1.02rem;margin-bottom:9px}
    .ur{font-size:1.04em;font-family:system-ui,"Noto Naskh Arabic","Noto Nastaliq Urdu",Tahoma,serif;line-height:1.9;letter-spacing:0}
    .hero .ur{font-size:1.1rem;color:#466250}
    .hero-right{display:flex;justify-content:center;align-items:center;z-index:1}
    .hero-note{width:100%;max-width:315px;background:#ffffffc9;border:1px solid #fff;border-radius:23px;padding:21px 23px;box-shadow:0 10px 26px #6e79501c;transform:rotate(2deg)}
    .hero-note .big-number{font-size:3rem;font-weight:900;letter-spacing:-.05em;color:var(--forest);line-height:1.1}
    .hero-note b{font-size:.96rem;display:block;margin:6px 0}
    .hero-note small{font-size:.88rem;color:var(--muted)}
    .prog-track{height:11px;background:#dfeadd;border-radius:20px;overflow:hidden;margin:13px 0 7px}
    .prog-fill{height:100%;background:linear-gradient(90deg,#62a883,#1b6658);border-radius:20px;transition:width .3s}
    .navtabs{display:flex;gap:8px;align-items:center;overflow:auto;padding:4px 0 15px}
    .navtab{flex-shrink:0;background:#fff;border:1px solid var(--border);border-radius:100px;padding:12px 19px;color:#3b574b;font-weight:760}
    .navtab.active{background:var(--forest);color:white;border-color:var(--forest)}
    .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
    .side{background:white;border:1px solid var(--border);border-radius:23px;padding:19px 14px 15px;box-shadow:var(--shadow);position:sticky;top:18px;max-height:calc(100vh - 40px);overflow:auto}
    .side-title{font-size:.88rem;font-weight:850;padding:3px 10px 12px}
    .week-label{font-size:.7rem;color:#83978d;letter-spacing:.14em;text-transform:uppercase;font-weight:900;margin:15px 12px 7px}
    .day-btn{width:100%;border:0;background:transparent;display:flex;align-items:center;text-align:left;gap:10px;padding:10px 10px;margin:2px 0;border-radius:13px;color:#40574f}
    .day-btn:hover{background:#f1f6f2}
    .day-btn.active{background:#e4f3eb;color:#115c49;font-weight:800}
    .day-num{width:31px;height:31px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;background:#edf1eb;font-size:.83rem;font-weight:850}
    .day-btn.active .day-num{background:var(--forest);color:white}
    .day-btn.done .day-num{background:#daf0de;color:#23704e}
    .day-text{font-size:.84rem;line-height:1.35;font-weight:650}
    .day-status{margin-left:auto;color:#298558;font-size:.92rem}
    .content{min-width:0}
    .panel{background:var(--white);border:1px solid var(--border);border-radius:23px;padding:25px 29px;box-shadow:var(--shadow);margin-bottom:17px}
    .lesson-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .small-label{font-size:.77rem;text-transform:uppercase;letter-spacing:.12em;color:var(--forest);font-weight:900;margin:0 0 8px}
    .lesson-title{font-size:clamp(1.6rem,3vw,2.25rem);line-height:1.2;letter-spacing:-.04em;margin:0 0 5px}
    .lesson-title-ur{font-size:1.1rem;color:#65786e;margin:0 0 11px}
    .badge{display:inline-block;border-radius:99px;background:#e8f5ea;color:#21634d;padding:8px 12px;font-size:.78rem;font-weight:850}
    .intro{color:#54695f;max-width:730px;margin:9px 0 0}
    .goal-box{margin-top:16px;background:#f3f8f3;border:1px solid #e5eee7;border-radius:15px;padding:15px 17px}
    .goal-box p{margin:0}.goal-box .ur{color:#607767;font-size:.98rem}
    .section-title{font-size:1.32rem;letter-spacing:-.026em;margin:0 0 5px}
    .section-sub{font-size:.9rem;color:var(--muted);margin-bottom:14px}
    .section-head{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
    .word-list{display:flex;gap:9px;flex-wrap:wrap}
    .word{display:flex;flex-direction:column;gap:1px;min-width:100px;flex:1;border:1px solid #e2e9df;border-radius:13px;padding:11px 12px;background:#fafcf9}
    .word button{align-self:flex-start;padding:0;border:0;background:transparent;text-align:left;color:var(--forest);font-weight:850;font-size:.96rem}
    .word .ur{font-size:.89rem;color:var(--muted)}
    .phrase{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:15px 0;border-bottom:1px solid #edf1eb}
    .phrase:last-child{border-bottom:0;padding-bottom:0}
    .english{font-size:1.07rem;font-weight:800;line-height:1.42;margin-bottom:2px}
    .translation{color:#718178;font-size:.97rem;line-height:1.9}
    .audio-btn,.soft-btn{border:1px solid #cfe8d8;background:#f0f8f1;color:var(--forest);padding:10px 14px;border-radius:12px;font-weight:800;display:inline-flex;align-items:center;gap:7px;justify-content:center;white-space:nowrap}
    .audio-btn:hover,.soft-btn:hover{background:#e4f2e8}
    .audio-btn{min-width:90px}
    .audio-btn.playing{background:#cce9d7;border-color:#a3d2b5}
    .audio-icon{font-size:.85rem}
    .toggleline{display:flex;align-items:center;gap:7px;color:#567166;font-size:.83rem;font-weight:650;user-select:none}
    .toggleline input{width:18px;height:18px;accent-color:var(--forest)}
    .talk{display:grid;gap:10px;margin:12px 0 15px}
    .bubble{max-width:88%;background:#f4f7f2;border-radius:17px 17px 17px 4px;padding:12px 16px}
    .bubble.b{background:#edf5ea;border-radius:17px 17px 4px 17px;margin-left:auto}
    .bubble .who{font-size:.73rem;font-weight:800;color:var(--forest);text-transform:uppercase;letter-spacing:.05em}
    .bubble .english{font-size:1rem;margin:3px 0}
    .bubble .ur{font-size:.89rem;color:#61736a}
    .listening-tools{display:flex;gap:9px;flex-wrap:wrap}
    .quiz-options{display:grid;gap:10px;margin:15px 0}
    .quiz-option{padding:14px 17px;text-align:left;border:1.5px solid #dce9df;border-radius:14px;background:#fff;display:flex;align-items:center;gap:12px;font-weight:710;color:#344d41}
    .quiz-option:hover{background:#f6faf6}
    .quiz-option.correct{background:#e4f5e6;border-color:#75bb90}
    .quiz-option.wrong{background:#fff0e9;border-color:#e9a78a}
    .option-dot{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;background:#f2f6f2;border-radius:100px;font-weight:850}
    .feedback{border-radius:13px;padding:12px 16px;font-weight:730;margin:12px 0}
    .feedback.good{background:#e5f5e7;color:#206a44}.feedback.try{background:#fff3e7;color:#875533}
    .mission{background:#fff6eb;border:1px solid #f5ddc5;border-radius:19px;padding:18px 21px;margin-bottom:14px}
    .mission p{margin-bottom:4px;font-weight:720}
    .mission .ur{font-weight:500;color:#8c6750}
    .big-check{display:flex;gap:12px;align-items:center;cursor:pointer;background:#f8faf6;border:1px solid #e2e8e0;border-radius:13px;padding:15px;font-weight:810}
    .big-check input{accent-color:var(--forest);width:23px;height:23px;flex-shrink:0}
    .record-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;align-items:center}
    .record-note{font-size:.79rem;color:var(--muted);margin:8px 0 0}
    .record-playback{width:100%;max-width:320px;display:block;margin-top:10px}
    .primary{border:0;background:var(--forest);color:white;padding:14px 22px;border-radius:14px;font-weight:850;box-shadow:0 5px 13px #1b615527}
    .primary:hover{background:#155444}
    .primary:disabled{box-shadow:none}
    .next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:7px}
    .tiny{font-size:.84rem;color:#788b80}
    .complete-banner{padding:18px;border:1px solid #cde7d3;background:#edf9ed;color:#236a47;border-radius:17px;font-weight:800;margin:12px 0 18px}
    .all-days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .day-card{text-align:left;background:white;border:1px solid #dce8dd;border-radius:19px;padding:17px 19px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;color:var(--ink)}
    .day-card:hover{background:#f5fbf6}
    .day-card .ur{font-size:.91rem;color:var(--muted)}
    .pill{border-radius:8px;padding:4px 8px;background:#eef3ef;color:var(--forest);font-size:.73rem;font-weight:850}
    .searchbar{width:100%;border:1.5px solid #d5e5d8;border-radius:14px;padding:15px 17px;outline:none;background:#fff;color:var(--ink);margin-bottom:18px}
    .phrasebook-group{margin-bottom:22px}.phrasebook-group h3{font-size:1.02rem;margin-bottom:10px}
    .book-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #edf1ed;padding:9px 0}
    .book-row .english{font-size:.95rem;margin-bottom:0}
    .empty{color:var(--muted);padding:20px;text-align:center}
    .footer{font-size:.82rem;color:#7a8b80;margin-top:25px;text-align:center}
    .mobile-day{display:none;margin:0 0 15px}.mobile-day select{width:100%;background:#fff;color:#345243;border:1px solid #d7e6d9;padding:13px;border-radius:12px}
    .toast{position:fixed;z-index:100;bottom:25px;left:50%;transform:translateX(-50%);border-radius:13px;background:#203d32;color:white;padding:12px 17px;max-width:min(92vw,490px);box-shadow:0 10px 25px #102a2230;font-size:.87rem;text-align:center}
    .small-space{margin-bottom:0}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.mobile-day{display:block}.hero{padding:26px}.hero-right{justify-content:flex-end}}
    @media(max-width:610px){.shell{padding:0 13px 42px}.header{padding:17px 2px 14px;gap:10px}.meta{display:none}.logo-mark{height:39px;width:39px;border-radius:13px}.logo{font-size:1rem}.top-chip{font-size:.7rem;padding:7px 10px}.hero{grid-template-columns:1fr;gap:17px;border-radius:21px;padding:24px 21px;margin:2px 0 16px}.hero-right{justify-content:flex-start}.hero-note{max-width:none;transform:none;padding:14px 18px}.hero-note .big-number{font-size:2rem}.hero-note .prog-track{margin:9px 0 4px}.hero p{font-size:.91rem}.navtabs{gap:7px}.navtab{font-size:.84rem;padding:10px 13px}.panel{padding:20px 17px;border-radius:18px}.phrase{gap:8px;align-items:flex-start}.phrase .english{font-size:1rem}.audio-btn{min-width:73px;padding:9px 10px;font-size:.84rem}.all-days{grid-template-columns:1fr}.word{min-width:110px}.bubble{max-width:96%}.lesson-title{font-size:1.7rem}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.prog-fill{transition:none}}
    @media print{.header .control-row,.navtabs,.side,.mobile-day,.audio-btn,.record-tools,.quiz-options,.next-row{display:none!important}.hero{background:#fff;padding:10px}.layout{display:block}.panel{box-shadow:none;break-inside:avoid}.shell{max-width:none}}
  </style>
</head>
<body>
<div id="app" class="shell" aria-live="off"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>

const LESSONS = [
  {
    title:'Hello & My Name', ur:'سلام اور تعارف', focus:'Start a friendly conversation',
    goal:'Today, you will introduce yourself in English.',
    goalUr:'آج آپ انگریزی میں اپنا تعارف کروائیں گی۔',
    words:[['Hello','سلام'],['Name','نام'],['From','سے'],['Live','رہنا'],['Nice','اچھا']],
    phrases:[
      ['Hello! How are you?','السلام علیکم! آپ کیسے ہیں؟'],
      ['My name is _____.','میرا نام _____ ہے۔'],
      ['I am from Pakistan.','میں پاکستان سے ہوں۔'],
      ['I live in Canada.','میں کینیڈا میں رہتی ہوں۔'],
      ['Nice to meet you.','آپ سے مل کر خوشی ہوئی۔']
    ],
    dialogue:[['A','Hello! What is your name?','ہیلو! آپ کا نام کیا ہے؟'],['B','My name is _____.','میرا نام _____ ہے۔'],['A','Nice to meet you.','آپ سے مل کر خوشی ہوئی۔'],['B','Nice to meet you, too.','مجھے بھی خوشی ہوئی۔']],
    quiz:{question:'What can you say when meeting someone?',options:['Nice to meet you.','I need a bag.','It is raining.'],answer:0,why:'“Nice to meet you” is a friendly greeting.'},
    mission:'Say hello and introduce yourself to someone at home.',missionUr:'گھر میں کسی کو انگریزی میں سلام کریں اور اپنا نام بتائیں۔',
    tip:'I am = I’m. Both are correct. Speak slowly!',tipUr:'I am اور I’m دونوں درست ہیں۔ آہستہ بولیں۔'
  },
  {
    title:'Please, Thank You & Sorry',ur:'ادب سے بات کرنا',focus:'Use kind, polite English',
    goal:'Ask politely and thank someone.',goalUr:'نرمی سے درخواست کرنا اور شکریہ کہنا سیکھیں۔',
    words:[['Please','براہ کرم'],['Thank you','شکریہ'],['Sorry','معاف کیجیے'],['Welcome','خوش آمدید'],['Excuse me','معاف کیجیے / توجہ دیجیے']],
    phrases:[['Please help me.','براہ کرم میری مدد کریں۔'],['Thank you very much.','آپ کا بہت شکریہ۔'],['You are welcome.','کوئی بات نہیں / خوشی سے۔'],['Excuse me, please.','معاف کیجیے، ایک بات پوچھنی ہے۔'],['I am sorry.','مجھے افسوس ہے۔']],
    dialogue:[['A','Excuse me, can you help me?','معاف کیجیے، کیا آپ مدد کر سکتے ہیں؟'],['B','Yes, of course.','جی ہاں، ضرور۔'],['A','Thank you very much.','آپ کا بہت شکریہ۔'],['B','You are welcome.','کوئی بات نہیں۔']],
    quiz:{question:'Someone helps you. What do you say?',options:['Where is it?','Thank you very much.','I am from Pakistan.'],answer:1,why:'Thank you is the polite response.'},
    mission:'Say “please” and “thank you” out loud three times today.',missionUr:'آج تین مرتبہ اونچی آواز میں please اور thank you بولیں۔',
    tip:'A kind smile and a short sentence are enough.',tipUr:'ایک ہلکی مسکراہٹ اور چھوٹا سا جملہ کافی ہے۔'
  },
  {
    title:'Please Speak Slowly',ur:'انگریزی سمجھنے میں مدد',focus:'Stay calm when you do not understand',
    goal:'Ask someone to repeat a sentence without feeling nervous.',goalUr:'بغیر گھبرائے کسی کو بات دہرانے کے لیے کہیں۔',
    words:[['Slowly','آہستہ'],['Again','دوبارہ'],['Understand','سمجھنا'],['English','انگریزی'],['Learning','سیکھنا']],
    phrases:[['I am learning English.','میں انگریزی سیکھ رہی ہوں۔'],['Please speak slowly.','براہ کرم آہستہ بولیں۔'],['Can you say that again?','کیا آپ دوبارہ کہہ سکتے ہیں؟'],['I do not understand.','مجھے سمجھ نہیں آیا۔'],['I understand a little English.','مجھے تھوڑی انگریزی سمجھ آتی ہے۔']],
    dialogue:[['A','Would you like a receipt?','کیا آپ کو رسید چاہیے؟'],['B','Please speak slowly.','براہ کرم آہستہ بولیں۔'],['A','Do you want a receipt?','کیا آپ کو رسید چاہیے؟'],['B','Yes, please. Thank you.','جی ہاں، شکریہ۔']],
    quiz:{question:'You did not understand a question. Say:',options:['Nice weather!','Can you say that again?','I live in Canada.'],answer:1,why:'Asking again is confident, not embarrassing.'},
    mission:'Practise “Please speak slowly” in a clear, calm voice.',missionUr:'آرام سے اور صاف آواز میں Please speak slowly بولیں۔',
    tip:'You do not need perfect English to communicate.',tipUr:'بات سمجھانے کے لیے مکمل یا پرفیکٹ انگریزی ضروری نہیں۔'
  },
  {
    title:'My Family & Home',ur:'گھر اور خاندان',focus:'Talk about your family and where you live',
    goal:'Say simple things about your home and family.',goalUr:'اپنے گھر اور خاندان کے بارے میں آسان باتیں کریں۔',
    words:[['Family','خاندان'],['Daughter','بیٹی'],['Son','بیٹا'],['Home','گھر'],['Together','اکٹھے']],
    phrases:[['This is my family.','یہ میرا خاندان ہے۔'],['I live with my family.','میں اپنے خاندان کے ساتھ رہتی ہوں۔'],['I have two daughters.','میری دو بیٹیاں ہیں۔'],['We live in Newfoundland.','ہم نیوفاؤنڈ لینڈ میں رہتے ہیں۔'],['I am at home today.','میں آج گھر پر ہوں۔']],
    dialogue:[['A','Do you live here?','کیا آپ یہاں رہتی ہیں؟'],['B','Yes, I live here.','جی ہاں، میں یہاں رہتی ہوں۔'],['A','Do you live with family?','کیا خاندان کے ساتھ رہتی ہیں؟'],['B','Yes, with my family.','جی ہاں، اپنے خاندان کے ساتھ۔']],
    quiz:{question:'Which sentence talks about your home?',options:['I live with my family.','How much is this?','It is cold.'],answer:0,why:'“I live with my family” tells someone about your home.'},
    mission:'Tell a family member two sentences about your home in English.',missionUr:'گھر والے کو اپنے گھر کے بارے میں انگریزی کے دو جملے بتائیں۔',
    tip:'Change the number of children to match your own family.',tipUr:'اپنے خاندان کے مطابق بیٹیوں یا بیٹوں کی تعداد بدل سکتی ہیں۔'
  },
  {

 const q=query.trim().toLowerCase(),groups=[];
 LESSONS.forEach((l,i)=>{

function cancelSpeech(){if('speechSynthesis' in window){speechSynthesis.cancel();}}
let playingAudio=false;
function chooseVoice(){
 if(!('speechSynthesis' in window))return null;
 const v=speechSynthesis.getVoices();
 return v.find(x=>x.lang.toLowerCase()==='en-ca')||v.find(x=>x.lang.toLowerCase()==='en-us')||v.find(x=>x.lang.toLowerCase().startsWith('en-'))||null;
}
function speak(text,finished){
 if(!('speechSynthesis' in window)){notice('Audio is not supported by this browser. You can still read and practise.');return;}
 const utter=new SpeechSynthesisUtterance(text.replace(/_____+/g,'Amina'));
 utter.lang='en-CA';utter.rate=state.slow?.78:.96;utter.pitch=1;utter.volume=1;
 const voice=chooseVoice();if(voice)utter.voice=voice;
 utter.onend=()=>{if(finished)finished();};utter.onerror=()=>{if(finished)finished();};
 speechSynthesis.speak(utter);
}
function speakOne(text){cancelSpeech();speak(text);}
function speakConversation(lines){
 cancelSpeech();playingAudio=true;let n=0;
 const next=()=>{
  if(!playingAudio||n>=lines.length){playingAudio=false;return;}
  const en=lines[n++][1];
  speak(en,()=>{if(playingAudio) setTimeout(next,350);});
 };next();
}
function stopSpeaking(){playingAudio=false;cancelSpeech();}
function clearRecording(){
 if(recorder&&recorder.state==='recording'){try{recorder.stop();}catch(e){}}
 if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
 if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null;}
 recorder=null;
}
async function startRecording(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){notice('Recording is unavailable here. Just speak aloud instead!');return;}
 clearRecording();
 const el=document.getElementById('record-status');
 if(el)el.textContent='Asking for microphone permission…';
 try{
   recStream=await navigator.mediaDevices.getUserMedia({audio:true});
   const chunks=[];recorder=new MediaRecorder(recStream);
   recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
   const thisRecorder=recorder;
   recorder.onstop=()=>{
    if(!chunks.length)return;
    const blob=new Blob(chunks,{type:thisRecorder.mimeType||'audio/webm'});
    recUrl=URL.createObjectURL(blob);
    const target=document.getElementById('record-container');
    if(target)target.innerHTML=`<audio controls class="record-playback" src="${recUrl}" aria-label="Play back your recording"></audio>`;
    if(el)el.textContent='Recording ready. Press play to hear yourself!';
   };
   recorder.start();if(el)el.textContent='● Recording... speak in your normal voice, then tap Stop.';
 }catch(e){
   if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
   if(el)el.textContent='Microphone is off or unavailable. You can practise without recording.';
 }
}
function stopRecording(){
 if(recorder&&recorder.state==='recording')recorder.stop();
 if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
}
function gotoDay(n){
 stopSpeaking();clearRecording();wrongAnswer=-1;
 state.lastDay=Math.max(0,Math.min(LESSONS.length-1,n));tab='learn';save();render();
 document.getElementById('lesson-start')?.scrollIntoView({behavior:'smooth',block:'start'});
}
app.addEventListener('click',e=>{
 const btn=e.target.closest('button[data-action]');if(!btn)return;
 const action=btn.dataset.action;const index=Number(btn.dataset.index||0);
 if(action==='small-text'||action==='big-text'){state.font=Math.max(.95,Math.min(1.4,Math.round((state.font+(action==='big-text'?.1:-.1))*100)/100));save();render();return;}
 if(action==='nav-learn'||action==='nav-all'||action==='nav-book'){stopSpeaking();clearRecording();wrongAnswer=-1;tab=action.split('-')[1]==='book'?'book':action.split('-')[1];render();return;}
 if(action==='select-day'){gotoDay(Number(btn.dataset.day));return;}
 if(action==='play-word'){speakOne(current().words[index][0]);return;}
 if(action==='play-phrase'){speakOne(current().phrases[index][0]);return;}
 if(action==='play-book'){speakOne(LESSONS[Number(btn.dataset.day)].phrases[index][0]);return;}
 if(action==='play-conversation'){speakConversation(current().dialogue);return;}
 if(action==='stop-audio'){stopSpeaking();return;}
 if(action==='quiz'){
  const answer=Number(btn.dataset.answer),i=state.lastDay;
  if(answer===current().quiz.answer){state.quiz[i]=true;wrongAnswer=-1;save();}else wrongAnswer=answer;
  render();return;
 }
 if(action==='finish-day'){
  const i=state.lastDay;if(state.quiz[i]&&state.practised[i]){state.done[i]=true;save();render();notice('Wonderful work! Day '+(i+1)+' is complete.');}
  return;
 }
 if(action==='next-day'){gotoDay(state.lastDay===LESSONS.length-1?0:state.lastDay+1);return;}
 if(action==='record'){startRecording();return;}
 if(action==='stop-record'){stopRecording();return;}
});
app.addEventListener('change',e=>{
 if(e.target.id==='mobile-select'){gotoDay(Number(e.target.value));return;}
 if(e.target.id==='slow-voice'){state.slow=e.target.checked;save();return;}
 if(e.target.id==='practised'){state.practised[state.lastDay]=e.target.checked;save();render();return;}
});
app.addEventListener('input',e=>{if(e.target.id==='phrase-search'){document.getElementById('phrase-results').innerHTML=phrasebookGroups(e.target.value);}});
window.addEventListener('beforeunload',()=>{stopSpeaking();clearRecording();});
render();

</script>
